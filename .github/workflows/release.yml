name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: apk-adb-tool.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: apk-adb-tool
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: apk-adb-tool-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare artifact
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/apk-adb-tool.exe ${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/apk-adb-tool ${{ matrix.artifact }}
            chmod +x ${{ matrix.artifact }}
          fi
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
