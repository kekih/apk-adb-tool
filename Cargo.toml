[package]
name = "apk-adb-tool"
version = "0.3.0"
edition = "2021"
description = "Search apps online (F-Droid), download APK and install on Android via ADB"
authors = ["kekih"]
license = "MIT"
repository = "https://github.com/kekih/apk-adb-tool"

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.29"
which = "6"
rfd = "0.15"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
