[package]
name = "apk-adb-tool"
version = "0.2.2"
edition = "2021"
description = "Dark-themed GUI to search installed Android apps via ADB, pull APK and reinstall"
authors = ["kekih"]
license = "MIT"
repository = "https://github.com/kekih/apk-adb-tool"

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.29"
which = "6"
rfd = "0.15"
open = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
