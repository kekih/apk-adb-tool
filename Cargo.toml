[package]
name = "apk-adb-tool"
version = "0.1.0"
edition = "2021"
description = "Search installed Android apps by name via ADB, list them, pull (download) the APK and reinstall it"
authors = ["kekih"]
license = "MIT"
repository = "https://github.com/kekih/apk-adb-tool"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
dialoguer = "0.11"
anyhow = "1.0"
colored = "2"
which = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
